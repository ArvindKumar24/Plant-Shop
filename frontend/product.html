<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details - GreenLeaf Plants</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span>🌿</span> GreenLeaf Plants</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html?category=indoor">Indoor</a>
        <a href="products.html?category=outdoor">Outdoor</a>
<a href="products.html">All Plants</a>
<a href="orders.html">My Orders</a>
<a href="cart.html" class="cart-link">🛒<span class="cart-count" id="cart-count">0</span></a>
        <span id="auth-nav"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="detail-container">
      <div class="empty"><h2>Loading...</h2></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 GreenLeaf Plants. All rights reserved.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const id = new URLSearchParams(window.location.search).get("id");
      const container = document.getElementById("detail-container");
      if (!id) {
        container.innerHTML = `<div class="empty"><h2>Invalid product</h2><a href="products.html" class="btn">Back to shop</a></div>`;
        return;
      }
      try {
        const data = await API.getProduct(id);
        if (!data.product) {
          container.innerHTML = `<div class="empty"><h2>Product not found</h2><a href="products.html" class="btn">Back to shop</a></div>`;
          return;
        }
const p = data.product;
        registerProduct(p);
        const stockLabel = p.stock <= 0 ? '<span class="badge stock-out">Out of Stock</span>'
                        : p.stock <= 5 ? '<span class="badge stock-low">Low Stock</span>'
                        : '<span class="badge" style="background:#e8f5e9;color:#2e7d32">In Stock</span>';
        container.innerHTML = `
          <div class="product-detail">
            <div>
              <img src="${productImage(p)}" alt="${p.name}" class="detail-img" onerror="this.src='https://via.placeholder.com/600x400/4caf50/ffffff?text=Plant';this.classList.add('no-img')">
            </div>
            <div class="detail-info">
              <span class="badge ${p.category}">${p.category}</span>
              <h1>${p.name}</h1>
              <div class="detail-meta">
                <span class="badge" style="background:#e8f5e9;color:#2e7d32">${p.plant_type}</span>
                ${stockLabel}
              </div>
              <div class="price">${formatPrice(p.price)}</div>
              <p class="desc">${p.description || "No description available."}</p>
<div class="qty-control">
                <button onclick="changeQty(-1)">−</button>
                <input type="number" id="qty" value="1" min="1" max="${p.stock || 1}" />
                <button onclick="changeQty(1)">+</button>
              </div>
              <button class="btn btn-block" ${p.stock <= 0 ? 'disabled style="opacity:0.5;cursor:not-allowed"' : ""} onclick="addToCartById(${p.id}, document.getElementById('qty').value)">
                ${p.stock <= 0 ? "Out of Stock" : "Add to Cart"}
              </button>
              <a href="products.html" class="btn btn-outline btn-block" style="margin-top:0.8rem">Continue Shopping</a>
            </div>
          </div>
          <div class="reviews-section">
            <h2>Ratings & Reviews</h2>
            <div id="reviews-summary"></div>
            <div id="review-form-container"></div>
            <div id="reviews-list"></div>
          </div>
        `;
        renderReviewSummary(p);
        loadReviews(p.id);
        renderReviewForm(p.id);
      } catch (e) {
        container.innerHTML = `<div class="empty"><h2>Could not load product</h2><p>Please check the server and database.</p></div>`;
      }
    });

    function changeQty(delta) {
      const input = document.getElementById("qty");
      const val = parseInt(input.value, 10) || 1;
      const max = parseInt(input.max, 10) || 99;
      const next = Math.min(max, Math.max(1, val + delta));
      input.value = next;
    }

    // ---------- Ratings & Reviews ----------

    /** Render the average rating summary block. */
    function renderReviewSummary(p) {
      const el = document.getElementById("reviews-summary");
      if (!el) return;
      const count = p.rating_count || 0;
      const avg = Number(p.avg_rating) || 0;
      el.innerHTML = `
        <div class="review-summary">
          <div class="review-summary-rating">${renderStars(avg)}</div>
          <div class="review-summary-text">
            <strong>${avg > 0 ? avg.toFixed(1) : "No ratings yet"}</strong>
            <span>${avg > 0 ? "based on " + count + " review" + (count === 1 ? "" : "s") : "Be the first to review"}</span>
          </div>
        </div>`;
    }

    /** Render the list of reviews for the product. */
    async function loadReviews(pid) {
      const el = document.getElementById("reviews-list");
      if (!el) return;
      try {
        const data = await API.getProductReviews(pid);
        const reviews = data.reviews || [];
        const user = getCurrentUser();
        if (!reviews.length) {
          el.innerHTML = `<div class="empty"><p>No reviews yet. Share your experience to help other plant lovers!</p></div>`;
          return;
        }
        el.innerHTML = reviews.map((r) => {
          const isOwn = user && user.id === r.user_id;
          return `
            <div class="review-card">
              <div class="review-head">
                <strong>${escapeHtml(r.user_name)}</strong>
                ${renderStars(r.rating)}
                ${isOwn ? '<span class="badge" style="background:#e8f5e9;color:#2e7d32">You</span>' : ""}
                <span class="review-date">${new Date(r.created_at).toLocaleDateString()}</span>
              </div>
              ${r.comment ? `<p class="review-comment">${escapeHtml(r.comment)}</p>` : ""}
              ${isOwn ? `<button class="btn btn-danger btn-sm" style="margin-top:0.5rem" onclick="deleteOwnReview(${pid}, ${r.id})">Delete my review</button>` : ""}
            </div>`;
        }).join("");
      } catch (e) {
        el.innerHTML = `<div class="empty"><p>Could not load reviews.</p></div>`;
      }
    }

    /** Render the review submission form (or a login prompt for guests). */
    function renderReviewForm(pid) {
      const el = document.getElementById("review-form-container");
      if (!el) return;
      if (!isLoggedIn()) {
        el.innerHTML = `<p class="review-login">Want to share your experience? <a href="login.html?redirect=${encodeURIComponent("product.html?id=" + pid)}">Log in</a> to rate and review this plant.</p>`;
        return;
      }
      API.getProductReviews(pid).then((data) => {
        const user = getCurrentUser();
        const own = (data.reviews || []).find((r) => user && r.user_id === user.id);
        const rating = own ? own.rating : 0;
        el.innerHTML = `
          <div class="review-form">
            <h3>${own ? "Edit your review" : "Write a review"}</h3>
            <div class="rating-input">
              ${[1, 2, 3, 4, 5].map((n) => `<span class="star-pick${n <= rating ? " filled" : ""}" onclick="pickRating(${n})">★</span>`).join("")}
              <span class="rating-label" id="rating-label">${own ? rating + " star" + (rating > 1 ? "s" : "") : "Click a star to rate"}</span>
            </div>
            <input type="hidden" id="selected-rating" value="${rating}" />
            <div class="form-group">
              <textarea id="review-comment" placeholder="Share your experience with this plant...">${own && own.comment ? escapeHtml(own.comment) : ""}</textarea>
            </div>
            <div class="modal-actions">
              <button class="btn" onclick="submitReview(${pid})">${own ? "Update Review" : "Submit Review"}</button>
            </div>
          </div>`;
      });
    }

    /** Highlight stars as the user picks a rating. */
    function pickRating(val) {
      const hidden = document.getElementById("selected-rating");
      if (hidden) hidden.value = val;
      document.querySelectorAll(".star-pick").forEach((s, i) => {
        s.classList.toggle("filled", i < val);
      });
      const label = document.getElementById("rating-label");
      if (label) label.textContent = val + " star" + (val > 1 ? "s" : "");
    }

    /** Submit or update the user's review, then refresh the section. */
    async function submitReview(pid) {
      const rating = parseInt(document.getElementById("selected-rating").value, 10);
      const comment = document.getElementById("review-comment").value.trim();
      if (!rating || rating < 1 || rating > 5) {
        showToast("Please select a star rating");
        return;
      }
      const result = await API.submitProductReview(pid, getAuthToken(), { rating, comment });
      if (result.success) {
        showToast("Review submitted");
        renderReviewForm(pid);
        loadReviews(pid);
        refreshRatingSummary(pid);
      } else {
        showToast(result.error || "Could not submit review");
      }
    }

    /** Delete the user's own review, then refresh the section. */
    async function deleteOwnReview(pid) {
      if (!confirm("Delete your review for this product?")) return;
      const result = await API.deleteProductReview(pid, getAuthToken());
      if (result.success) {
        showToast("Review deleted");
        renderReviewForm(pid);
        loadReviews(pid);
        refreshRatingSummary(pid);
      } else {
        showToast(result.error || "Could not delete review");
      }
    }

    /** Re-fetch the product to refresh the average rating after a change. */
    async function refreshRatingSummary(pid) {
      try {
        const data = await API.getProduct(pid);
        if (data.product) renderReviewSummary(data.product);
      } catch (e) {}
    }
  </script>
</body>
</html>
